name: Mutation

# Monthly and by hand, never on a pull request or a push (docs/design.md, "Monthly report (#476, #502)";
# docs/research/mutation-testing.md). One job per scoped file, in parallel. The schedule mutates only the sites on
# lines changed since main's commit of 35 days ago, and a survivor there fails the job, so GitHub's failure email
# is the notification. A dispatch with `full` mutates the whole file for a baseline: survivors are reported in the
# job summary and the job stays green. `file` runs one entry. branch_guard.py and tests_first.py run in a fixed
# number of parts holding equal numbers of sites (`--lines`), so a full baseline fits the job limit.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Mutate the whole file (a baseline), not only the lines changed in the last 35 days"
        type: boolean
        default: false
      file:
        description: "The file to mutate (all: every file)"
        type: choice
        default: all
        options:
          - all
          - hooks/branch_guard.py
          - hooks/backup_gate.py
          - hooks/tests_first.py
          - hooks/readonly_allow.py
          - hooks/readonly_bash.py
          - hooks/land_ask.py
          - lib/harness_lib/backups.py
          - lib/harness_lib/shellwalk.py

concurrency:
  group: mutation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the kill rule reads the earlier scheduled runs

jobs:
  mutate:
    name: ${{ matrix.file }} (part ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        file:
          - hooks/branch_guard.py
          - hooks/backup_gate.py
          - hooks/tests_first.py
          - hooks/readonly_allow.py
          - hooks/readonly_bash.py
          - hooks/land_ask.py
          - lib/harness_lib/backups.py
          - lib/harness_lib/shellwalk.py
        part: [1, 2, 3]
    steps:
      - name: Pick this entry
        id: pick
        env:
          FILE: ${{ matrix.file }}
          PART: ${{ matrix.part }}
          ONLY: ${{ inputs.file }}
        run: |
          # each file's fixed part count; an entry past it, or another file than the `file` input, runs nothing
          case "$FILE" in
            hooks/branch_guard.py) parts=3 ;;
            hooks/tests_first.py) parts=2 ;;
            *) parts=1 ;;
          esac
          run=true
          if [ "$PART" -gt "$parts" ]; then run=false; fi
          if [ -n "$ONLY" ] && [ "$ONLY" != all ] && [ "$ONLY" != "$FILE" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE" .py)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.pick.outputs.run == 'true'
        with:
          fetch-depth: 0
      - name: Mutate the file
        id: mutate
        if: steps.pick.outputs.run == 'true'
        env:
          FILE: ${{ matrix.file }}
          PART: ${{ matrix.part }}
          PARTS: ${{ steps.pick.outputs.parts }}
          FULL: ${{ inputs.full }}
        run: |
          target="plugins/harness/$FILE"
          set -- "$target"
          if [ "$FULL" != true ]; then
            base=$(git rev-list -1 --first-parent --before="35 days ago" HEAD)
            [ -n "$base" ] || { echo "no commit 35 days back"; exit 1; }
            echo "base=$base" >> "$GITHUB_OUTPUT"
            set -- "$@" --changed "$base"
          fi
          if [ "$PARTS" -gt 1 ]; then
            # part N of M: the lines holding the Nth M-th of the whole file's sites (--changed then keeps those changed)
            lines=$(python3 - "$target" "$PART" "$PARTS" <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import mutate
          rel, part, parts = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          sites = {}
          for m in mutate.mutants(os.getcwd(), rel, None):
              sites[m["line"]] = sites.get(m["line"], 0) + 1
          total, before, chosen = sum(sites.values()), 0, []
          for line in sorted(sites):
              if before * parts // total == part - 1:
                  chosen.append(str(line))
              before += sites[line]
          print(",".join(chosen))
          PY
            )
            [ -n "$lines" ] || { echo "no sites in part $PART of $target"; exit 1; }
            set -- "$@" --lines "$lines"
          fi
          echo "mutate.py run $*"
          status=0
          python3 scripts/mutate.py run "$@" --json > mutation.json || status=$?
          # 3 is survivors: under full they are the baseline's report; on the schedule they are on changed lines
          if [ "$status" -eq 3 ] && [ "$FULL" = true ]; then status=0; fi
          exit "$status"
      - name: Write the job summary
        if: always() && steps.pick.outputs.run == 'true'
        env:
          FILE: ${{ matrix.file }}
          PART: ${{ matrix.part }}
          PARTS: ${{ steps.pick.outputs.parts }}
          FULL: ${{ inputs.full }}
          BASE: ${{ steps.mutate.outputs.base }}
        run: |
          python3 - <<'PY' > mutation.txt
          import json, os
          env = os.environ
          what = env["FILE"] + ("" if env["PARTS"] == "1" else " part %s of %s" % (env["PART"], env["PARTS"]))
          scope = "the whole file" if env["FULL"] == "true" else "the lines changed since %s" % env["BASE"][:12]
          try:
              with open("mutation.json") as handle:
                  data = json.load(handle)
          except (OSError, ValueError):
              print("%s, %s: no report, the run did not finish (see its log)" % (what, scope))
              raise SystemExit
          if not data["killed"] and not data["survived"]:
              print("%s: no mutation site on %s" % (what, scope))
              raise SystemExit
          print("%s, %s: %d killed (%d timed out), %d survived" % (what, scope, data["killed"], data["timed_out"],
                                                                   data["survived"]))
          print()
          for s in data["survivors"]:
              print("- survived: `%s:%d` in `%s`: `%s`" % (s["path"], s["line"], s["function"], s["change"]))
          for f in data["files"]:
              for name, c in sorted(f["functions"].items()):
                  if c["survived"] and not c["killed"]:
                      print("- every mutant survived, unreached or unasserted: `%s` (%d)" % (name, c["survived"]))
          print()
          PY
          cat mutation.txt
          cat mutation.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always() && steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ steps.pick.outputs.name }}-${{ matrix.part }}
          path: |
            mutation.json
            mutation.txt
          if-no-files-found: ignore

  kill-rule:
    needs: mutate
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Note three scheduled runs in a row with no survivor
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.mutate.result }}
        run: |
          # a green scheduled run found no survivor on a changed line; this one and the two before it
          [ "$RESULT" = success ] || exit 0
          clean=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutation.yml --event schedule --status completed \
            --limit 2 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length') || clean=unknown
          echo "earlier clean scheduled runs, of the last 2: $clean"
          if [ "$clean" = 2 ]; then
            echo "Kill rule: three scheduled runs in a row found no survivor. Remove the schedule from .github/workflows/mutation.yml and keep scripts/mutate.py (docs/design.md, Monthly report)." >> "$GITHUB_STEP_SUMMARY"
          fi
