name: CI

# On pull requests and by hand. Not on the push to main: a squash merge lands the tree the pull
# request run already verified, and harness-pr land refuses a conflicting or behind-main branch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify
        run: scripts/verify.sh
